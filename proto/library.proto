syntax = "proto3";
package library;


import "google/protobuf/timestamp.proto";


message Book {
int32 id = 1;
string title = 2;
string author = 3;
string isbn = 4;
int32 published_year = 5;
}


message Member {
int32 id = 1;
string name = 2;
string email = 3;
string phone = 4;
string address = 5;
}


message Borrow {
int32 id = 1;
int32 book_id = 2;
int32 member_id = 3;
google.protobuf.Timestamp borrowed_at = 4;
google.protobuf.Timestamp due_at = 5;
google.protobuf.Timestamp returned_at = 6;
}


message CreateBookRequest { Book book = 1; }
message UpdateBookRequest { Book book = 1; }
message CreateBookResponse { Book book = 1; }

message CreateMemberRequest { Member member = 1; }
message UpdateMemberRequest { Member member = 1; }
message CreateMemberResponse { Member member = 1; }

message BorrowRequest { int32 book_id = 1; int32 member_id = 2; int64 due_timestamp_unix = 3; }
message BorrowResponse { Borrow borrow = 1; }

message ReturnRequest { int32 borrow_id = 1; }
message ReturnResponse { Borrow borrow = 1; }

message ListBorrowedByMemberRequest { int32 member_id = 1; }
message ListBorrowedByMemberResponse { repeated Borrow borrows = 1; }

service LibraryService {
    rpc CreateBook(CreateBookRequest) returns (CreateBookResponse);
    rpc UpdateBook(UpdateBookRequest) returns (CreateBookResponse);
    rpc CreateMember(CreateMemberRequest) returns (CreateMemberResponse);
    rpc UpdateMember(UpdateMemberRequest) returns (CreateMemberResponse);
    rpc BorrowBook(BorrowRequest) returns (BorrowResponse);
    rpc ReturnBook(ReturnRequest) returns (ReturnResponse);
    rpc ListBorrowedByMember(ListBorrowedByMemberRequest) returns (ListBorrowedByMemberResponse);
}